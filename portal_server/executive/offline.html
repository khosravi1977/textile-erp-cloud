<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082b2f"><title>مرکز فرمان آفلاین است</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06191c;color:#eff7f3;font-family:Tahoma,Arial;padding:24px}.box{max-width:560px;border:1px solid #23464b;border-radius:22px;background:#0a2428;padding:28px;line-height:2}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#f2c86b;margin-left:8px}button{border:0;border-radius:12px;padding:12px 18px;background:#43c3a5;color:#05221f;font-weight:bold;cursor:pointer}</style></head>
<body><main class="box"><h1><span class="dot"></span>اتصال اینترنت برقرار نیست</h1><p>برای حفاظت از اطلاعات مالی و تولید، داده‌های مدیریتی روی دستگاه ذخیره نمی‌شوند. پس از برقراری اینترنت دوباره تلاش کنید.</p><button type="button" onclick="location.reload()">تلاش دوباره</button></main></body>
</html>
