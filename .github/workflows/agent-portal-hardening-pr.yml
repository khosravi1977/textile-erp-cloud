name: Agent portal hardening PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'fix/accounting-audit-security-rbac'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accounting-audit-security-rbac
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Apply deterministic patch
        run: python scripts/agent_portal_hardening.py
      - name: Format and test portal
        run: |
          gofmt -w portal_server/main.go portal_server/rbac_security.go portal_server/rbac_security_test.go
          cd portal_server
          go test ./...
      - name: Commit fix if needed
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain portal_server)" ]; then
            echo "No portal changes to commit"
            exit 0
          fi
          git config user.name "Viora Accounting Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add portal_server/main.go portal_server/rbac_security.go portal_server/rbac_security_test.go
          git commit -m "[agent-fix] harden portal password handling and RBAC mapping"
          git push origin HEAD:fix/accounting-audit-security-rbac
