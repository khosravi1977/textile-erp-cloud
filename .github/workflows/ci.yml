name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: textile_test
          POSTGRES_PASSWORD: textile_test
          POSTGRES_DB: textile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U textile_test -d textile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://textile_test:textile_test@127.0.0.1:5432/textile_test?sslmode=disable
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: textile_test
      DB_PASSWORD: textile_test
      DB_NAME: textile_test
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - name: Production compose release paths
        run: bash deploy/production/validate-compose.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            financial/web/package-lock.json
            operational_cycle_go/web/package-lock.json
      - name: Financial tests and PostgreSQL migration integration
        run: go test ./...
        working-directory: financial
      - name: Operational tests
        run: go test ./...
        working-directory: operational_cycle_go
      - name: Portal tests
        run: go test ./...
        working-directory: portal_server
      - name: Financial web production build
        run: npm ci && npm run build
        working-directory: financial/web
      - name: Operational web production build
        run: npm ci && npm run build
        working-directory: operational_cycle_go/web
      - name: Docker compose config
        run: docker compose -f docker-compose.prod.yml config
        working-directory: financial
      - name: Kustomize render
        run: |
          sudo snap install kubectl --classic
          kubectl kustomize deploy/k8s
        working-directory: financial
