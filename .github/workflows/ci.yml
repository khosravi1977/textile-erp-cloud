name: ci

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: textile_test
          POSTGRES_PASSWORD: textile_test
          POSTGRES_DB: textile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U textile_test -d textile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://textile_test:textile_test@127.0.0.1:5432/textile_test?sslmode=disable
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: textile_test
      DB_PASSWORD: textile_test
      DB_NAME: textile_test
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Production smoke script syntax
        run: bash -n deploy/production/smoke-production.sh
      - name: Production compose release paths
        run: bash deploy/production/validate-compose.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            financial/web/package-lock.json
            operational_cycle_go/web/package-lock.json
      - name: Financial tests and PostgreSQL migration integration
        run: go test ./...
        working-directory: financial
      - name: Operational tests
        run: go test ./...
        working-directory: operational_cycle_go
      - name: Portal hardening and tests
        run: |
          go run ./tools/hardener -file main.go
          gofmt -w main.go
          go test ./...
        working-directory: portal_server
      - name: Financial web production build
        run: npm ci && npm run build
        working-directory: financial/web
      - name: Financial UI regression (isolated API fixtures)
        run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: financial/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: financial-ui-regression
          path: |
            financial/web/playwright-report
            financial/web/test-results
          retention-days: 7
      - name: Operational web production build
        run: npm ci && npm run build
        working-directory: operational_cycle_go/web
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: telegram_relay/package-lock.json
      - name: Telegram relay security tests and production build
        run: npm ci && npm test
        working-directory: telegram_relay
      - name: Telegram runtime proxy tests
        run: python3 -m unittest relay_test -v
        working-directory: telegram_relay/runtime_proxy
      - name: Docker compose config
        run: docker compose -f docker-compose.prod.yml config
        working-directory: financial
      - name: Kustomize render
        run: |
          sudo snap install kubectl --classic
          kubectl kustomize deploy/k8s
        working-directory: financial
