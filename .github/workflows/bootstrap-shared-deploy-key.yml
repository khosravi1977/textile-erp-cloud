name: bootstrap-shared-deploy-key

on:
  workflow_dispatch:
    inputs:
      additional_public_key:
        description: Optional extra restricted public key to install
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-shared-deploy-key-production
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure current restricted VPS access
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Install shared restricted deployment key
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHARED_DEPLOY_PUBLIC_KEY: ${{ secrets.VIORA_SHARED_DEPLOY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$SHARED_DEPLOY_PUBLIC_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+\ viora-shared-deploy-[0-9-]+$ ]]
          restricted_key="no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty $SHARED_DEPLOY_PUBLIC_KEY"
          encoded_key="$(printf '%s' "$restricted_key" | base64 -w0)"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             umask 077
             install -d -m 0700 \"\$HOME/.ssh\"
             touch \"\$HOME/.ssh/authorized_keys\"
             chmod 0600 \"\$HOME/.ssh/authorized_keys\"
             candidate=\"\$(printf '%s' '$encoded_key' | base64 --decode)\"
             grep -Fqx -- \"\$candidate\" \"\$HOME/.ssh/authorized_keys\" || printf '%s\\n' \"\$candidate\" >> \"\$HOME/.ssh/authorized_keys\"
             sudo /usr/local/sbin/viora-deploy ghcr-logout"

      - name: Install requested local restricted key
        if: ${{ inputs.additional_public_key != '' }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ADDITIONAL_PUBLIC_KEY: ${{ inputs.additional_public_key }}
        run: |
          set -euo pipefail
          [[ "$ADDITIONAL_PUBLIC_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+\ [A-Za-z0-9._@-]+$ ]]
          restricted_key="no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty $ADDITIONAL_PUBLIC_KEY"
          encoded_key="$(printf '%s' "$restricted_key" | base64 -w0)"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             umask 077
             install -d -m 0700 \"\$HOME/.ssh\"
             touch \"\$HOME/.ssh/authorized_keys\"
             chmod 0600 \"\$HOME/.ssh/authorized_keys\"
             candidate=\"\$(printf '%s' '$encoded_key' | base64 --decode)\"
             grep -Fqx -- \"\$candidate\" \"\$HOME/.ssh/authorized_keys\" || printf '%s\\n' \"\$candidate\" >> \"\$HOME/.ssh/authorized_keys\""

      - name: Verify shared restricted access
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHARED_DEPLOY_PRIVATE_KEY_B64: ${{ secrets.VIORA_SHARED_DEPLOY_PRIVATE_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/shared-key"
          printf '%s' "$SHARED_DEPLOY_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/shared-key/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/shared-key/known_hosts"
          chmod 0600 "$RUNNER_TEMP/shared-key/id_ed25519" "$RUNNER_TEMP/shared-key/known_hosts"
          ssh -o BatchMode=yes \
            -i "$RUNNER_TEMP/shared-key/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/shared-key/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "test \"\$(id -u)\" -ne 0 && sudo /usr/local/sbin/viora-deploy ghcr-logout"

