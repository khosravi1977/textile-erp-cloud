name: deploy-vps

on:
  workflow_run:
    workflows: [publish-images]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA whose images are already published
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: deploy-textile-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download release identity
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: production-release
          path: ${{ runner.temp }}/published-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve release
        shell: bash
        env:
          MANUAL_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            release_sha="$(tr -d '\r\n' < "$RUNNER_TEMP/published-release/release-sha")"
          else
            release_sha="$MANUAL_RELEASE_SHA"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "REMOTE_ARCHIVE=/tmp/viora-deploy-textile-erp-$release_sha.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package reviewed source and manifests
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_SHA"
          test -f deploy/production/compose.images.yaml
          git archive --format=tar.gz --output="$RUNNER_TEMP/release.tar.gz" "$RELEASE_SHA"
      - name: Configure restricted VPS access
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
      - name: Install Textile Telegram runtime configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TEXTILE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TEXTILE_TELEGRAM_BOT_USERNAME }}
          TELEGRAM_RELAY_URL: ${{ secrets.TEXTILE_TELEGRAM_RELAY_URL }}
          TELEGRAM_RELAY_TOKEN: ${{ secrets.TEXTILE_TELEGRAM_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          configured="${TELEGRAM_BOT_USERNAME#@}"
          [[ "$configured" =~ ^[A-Za-z][A-Za-z0-9_]{4,31}$ ]]
          [[ "$TELEGRAM_RELAY_URL" =~ ^https://[^/?#]+(/[^?#]*)?$ ]]
          [[ "$TELEGRAM_RELAY_TOKEN" =~ ^[A-Za-z0-9_-]{43,128}$ ]]
          response="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $TELEGRAM_RELAY_TOKEN" \
            -H "X-Telegram-Bot-Token: $TELEGRAM_BOT_TOKEN" \
            "${TELEGRAM_RELAY_URL%/}/getMe")"
          actual="$(jq -er '.result | select(.is_bot == true) | .username' <<<"$response")"
          test "${actual,,}" = "${configured,,}"
          local_file="$RUNNER_TEMP/textile-telegram.env"
          remote_file="/var/tmp/textile-telegram.env"
          remote_temp="${remote_file}.${GITHUB_RUN_ID}.tmp"
          printf 'TEXTILE_TELEGRAM_ENABLED=true\n' > "$local_file"
          printf 'TEXTILE_TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" >> "$local_file"
          printf 'TEXTILE_TELEGRAM_BOT_USERNAME=%s\n' "$configured" >> "$local_file"
          printf 'TEXTILE_TELEGRAM_RELAY_URL=%s\n' "${TELEGRAM_RELAY_URL%/}" >> "$local_file"
          printf 'TEXTILE_TELEGRAM_RELAY_TOKEN=%s\n' "$TELEGRAM_RELAY_TOKEN" >> "$local_file"
          chmod 0600 "$local_file"
          scp -o BatchMode=yes "$local_file" "$VPS_USER@$VPS_HOST:$remote_temp"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "set -eu; umask 077; test ! -L '$remote_file'; chmod 0600 '$remote_temp'; mv -f '$remote_temp' '$remote_file'"
      - name: Verify Textile Telegram relay from VPS
        id: telegram_relay_vps
        continue-on-error: true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            . /var/tmp/textile-telegram.env
            response="$(curl --fail --silent --show-error --max-time 30 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer $TEXTILE_TELEGRAM_RELAY_TOKEN" \
              -H "X-Telegram-Bot-Token: $TEXTILE_TELEGRAM_BOT_TOKEN" \
              "${TEXTILE_TELEGRAM_RELAY_URL%/}/getMe")"
            printf "%s" "$response" | grep -Eq '"'"'"ok"[[:space:]]*:[[:space:]]*true'"'"'
          '
      - name: Disable unavailable Telegram runtime without blocking core release
        if: steps.telegram_relay_vps.outcome == 'failure'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "::warning::Telegram relay is blocked from the VPS; deploying Textile ERP with Telegram reports disabled."
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -eu
            umask 077
            remote_file=/var/tmp/textile-telegram.env
            remote_temp="$(mktemp "${remote_file}.disabled.XXXXXX")"
            trap "rm -f \"$remote_temp\"" EXIT
            test -f "$remote_file"
            sed "s/^TEXTILE_TELEGRAM_ENABLED=.*/TEXTILE_TELEGRAM_ENABLED=false/" "$remote_file" > "$remote_temp"
            grep -qx "TEXTILE_TELEGRAM_ENABLED=false" "$remote_temp"
            chmod 0600 "$remote_temp"
            mv -f "$remote_temp" "$remote_file"
            trap - EXIT
          '
      - name: Authenticate VPS for private images
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/viora-deploy ghcr-login '${{ github.actor }}'"
      - name: Deploy immutable release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes "$RUNNER_TEMP/release.tar.gz" "$VPS_USER@$VPS_HOST:$REMOTE_ARCHIVE"
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/viora-deploy textile-erp '$RELEASE_SHA' '$REMOTE_ARCHIVE'"
      - name: Remove temporary registry credentials
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/viora-deploy ghcr-logout" || true
      - name: Verify public service
        shell: bash
        run: bash deploy/production/smoke-production.sh
