name: publish-images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go test ./...
        working-directory: financial
      - run: go test ./...
        working-directory: operational_cycle_go
      - run: go test ./...
        working-directory: portal_server

  images:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: textile-financial-api
            context: financial
            file: financial/Dockerfile
            build_args: |-
              
          - image: textile-financial-web
            context: financial/web
            file: financial/web/Dockerfile
            build_args: |-
              
          - image: textile-operational
            context: operational_cycle_go
            file: operational_cycle_go/Dockerfile
            build_args: |-
              
          - image: textile-portal
            context: portal_server
            file: portal_server/Dockerfile
            build_args: |-
              
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

  release:
    if: github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s' '${{ github.sha }}' > release-sha
      - uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: release-sha
          retention-days: 7
