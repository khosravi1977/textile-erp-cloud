name: publish-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: textile_test
          POSTGRES_PASSWORD: textile_test
          POSTGRES_DB: textile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U textile_test -d textile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://textile_test:textile_test@127.0.0.1:5432/textile_test?sslmode=disable
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: textile_test
      DB_PASSWORD: textile_test
      DB_NAME: textile_test
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - name: Production smoke script syntax
        run: bash -n deploy/production/smoke-production.sh
      - name: Production compose release paths
        run: bash deploy/production/validate-compose.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            financial/web/package-lock.json
            operational_cycle_go/web/package-lock.json
      - run: go test ./...
        working-directory: financial
      - run: go test ./...
        working-directory: operational_cycle_go
      - run: go test ./...
        working-directory: portal_server
      - run: npm ci && npm run build
        working-directory: financial/web
      - run: npm ci && npm run build
        working-directory: operational_cycle_go/web
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: telegram_relay/package-lock.json
      - run: npm ci && npm test
        working-directory: telegram_relay
      - run: python3 -m unittest relay_test -v
        working-directory: telegram_relay/runtime_proxy

  images:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: textile-financial-api
            context: financial
            file: financial/Dockerfile
            build_args: |-
              
          - image: textile-financial-web
            context: financial/web
            file: financial/web/Dockerfile
            build_args: |-
              
          - image: textile-operational
            context: operational_cycle_go
            file: operational_cycle_go/Dockerfile
            build_args: |-
              
          - image: textile-portal
            context: portal_server
            file: portal_server/Dockerfile
            build_args: |-
              
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

  release:
    if: github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s' '${{ github.sha }}' > release-sha
      - uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: release-sha
          retention-days: 7
