name: textile-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: textile-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - textile_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:16-alpine
    container_name: textile-erp-db-replica
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - textile_erp_postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: textile-erp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  financial-api:
    build:
      context: ./financial
      dockerfile: Dockerfile
    container_name: textile-erp-financial-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8081"
    env_file:
      - path: ${TEXTILE_TELEGRAM_ENV_FILE:-/var/tmp/textile-telegram.env}
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # The current postgres-replica container is an independent stale database,
      # not a streaming replica. Keep reads on the primary until replication is rebuilt.
      DB_READ_HOST: ""
      DB_READ_PORT: 5432
      DB_READ_USER: ${DB_USER}
      DB_READ_PASSWORD: ${DB_PASSWORD}
      DB_READ_NAME: ${DB_NAME}
      APP_PORT: 8081
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      FINANCIAL_ADMIN_PASSWORD: ${FINANCIAL_ADMIN_PASSWORD}
      VIORA_AI_ENABLED: ${VIORA_AI_ENABLED:-false}
      VIORA_AI_API_KEY: ${VIORA_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VIORA_AI_MODEL: ${VIORA_AI_MODEL:-gpt-5.6-luna}
      VIORA_AI_BASE_URL: ${VIORA_AI_BASE_URL:-https://api.openai.com/v1}
      VIORA_AI_API_STYLE: ${VIORA_AI_API_STYLE:-responses}
      VIORA_AI_MONTHLY_REQUEST_LIMIT: ${VIORA_AI_MONTHLY_REQUEST_LIMIT:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  financial-web:
    build:
      context: ./financial/web
      dockerfile: Dockerfile
    container_name: textile-erp-financial-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

  operational-app:
    build:
      context: ./operational_cycle_go
      dockerfile: Dockerfile
    container_name: textile-erp-operational-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8091"
    environment:
      OPERATIONAL_DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      PORT: 8091
      OPERATIONAL_ADMIN_PASSWORD: ${OPERATIONAL_ADMIN_PASSWORD}
      OPERATIONAL_PORTAL_SECRET: ${OPERATIONAL_PORTAL_SECRET}
      LOADING_PUBLIC_BASE: ${LOADING_PUBLIC_BASE:-}
      LOADING_SESSION_TTL_MINUTES: ${LOADING_SESSION_TTL_MINUTES:-480}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  portal:
    build:
      context: ./portal_server
      dockerfile: Dockerfile
    container_name: textile-erp-portal
    restart: unless-stopped
    command:
      - -addr=:8080
      - -financial=http://financial-web
      - -operational=http://textile-erp-operational-app:8091
      - -financial-api=http://financial-api:8081
      - -operational-api=http://textile-erp-operational-app:8091
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      PORTAL_PUBLIC_BASE: ${PORTAL_PUBLIC_BASE}
      PORTAL_COOLER_STORE_URL: ${PORTAL_COOLER_STORE_URL}
      PORTAL_COOLER_STORE_SECRET: ${PORTAL_COOLER_STORE_SECRET}
      PORTAL_ADMIN_USERNAME: ${PORTAL_ADMIN_USERNAME}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PORTAL_ALLOW_OPERATIONAL_CUSTOMER_ACCESS: ${PORTAL_ALLOW_OPERATIONAL_CUSTOMER_ACCESS}
      PORTAL_FINANCIAL_JWT_SECRET: ${JWT_SECRET}
      OPERATIONAL_ADMIN_PASSWORD: ${OPERATIONAL_ADMIN_PASSWORD}
      PORTAL_OPERATIONAL_SECRET: ${OPERATIONAL_PORTAL_SECRET}
      PORTAL_WEAVING_MONITOR_SUMMARY_URL: ${PORTAL_WEAVING_MONITOR_SUMMARY_URL:-}
      PORTAL_WEAVING_MONITOR_TOKEN: ${PORTAL_WEAVING_MONITOR_TOKEN:-}
      PORTAL_WEAVING_APP_URL: ${PORTAL_WEAVING_APP_URL:-https://weaving.vioraapps.com}
      ACCESS_DB_PATH: /data/portal-access.db
      PORTAL_ORDERS_PATH: /data/portal-orders.json
    volumes:
      - textile_erp_portal_data:/data
    depends_on:
      financial-web:
        condition: service_healthy
      financial-api:
        condition: service_healthy
      operational-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: textile-erp-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9190:9090"
    volumes:
      - ./financial/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - textile_erp_prometheus_data:/prometheus
    depends_on:
      financial-api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.3.1
    container_name: textile-erp-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - textile_erp_grafana_data:/var/lib/grafana
      - ./financial/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./financial/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  textile_erp_postgres_data:
  textile_erp_postgres_replica_data:
  textile_erp_prometheus_data:
  textile_erp_grafana_data:
  textile_erp_portal_data:
