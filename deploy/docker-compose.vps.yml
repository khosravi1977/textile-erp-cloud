name: textile-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: textile-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - textile_erp_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: textile-erp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  financial-api:
    build:
      context: ../financial
      dockerfile: Dockerfile
    container_name: textile-erp-financial-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_PORT: 8081
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      FINANCIAL_ADMIN_PASSWORD: ${FINANCIAL_ADMIN_PASSWORD}
      FINANCIAL_ALLOWED_ORIGINS: ${PORTAL_PUBLIC_BASE}
      TRUST_PROXY: "true"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  financial-web:
    build:
      context: ../financial/web
      dockerfile: Dockerfile
    container_name: textile-erp-financial-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

  operational-app:
    build:
      context: ../operational_cycle_go
      dockerfile: Dockerfile
    container_name: textile-erp-operational-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8091"
    environment:
      OPERATIONAL_DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      PORT: 8091
      APP_ENV: production
      OPERATIONAL_ADMIN_PASSWORD: ${OPERATIONAL_ADMIN_PASSWORD}
      OPERATIONAL_SESSION_SECRET: ${OPERATIONAL_SESSION_SECRET}
      PORTAL_OPERATIONAL_SECRET: ${PORTAL_OPERATIONAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  portal:
    build:
      context: ../portal_server
      dockerfile: Dockerfile
    container_name: textile-erp-portal
    restart: unless-stopped
    command:
      - -addr=:8080
      - -financial=http://financial-web
      - -operational=http://textile-erp-operational-app:8091
      - -financial-api=http://financial-api:8081
      - -operational-api=http://textile-erp-operational-app:8091
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      PORTAL_PUBLIC_BASE: ${PORTAL_PUBLIC_BASE}
      APP_ENV: production
      PORTAL_COOLER_STORE_URL: ${PORTAL_COOLER_STORE_URL}
      PORTAL_COOLER_STORE_SECRET: ${PORTAL_COOLER_STORE_SECRET}
      PORTAL_ADMIN_USERNAME: ${PORTAL_ADMIN_USERNAME}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PORTAL_OPERATIONAL_SECRET: ${PORTAL_OPERATIONAL_SECRET}
      PORTAL_ALLOW_OPERATIONAL_CUSTOMER_ACCESS: ${PORTAL_ALLOW_OPERATIONAL_CUSTOMER_ACCESS}
      PORTAL_FINANCIAL_JWT_SECRET: ${JWT_SECRET}
      OPERATIONAL_ADMIN_PASSWORD: ${OPERATIONAL_ADMIN_PASSWORD}
      ACCESS_DB_PATH: /data/portal-access.db
    volumes:
      - textile_erp_portal_data:/data
    depends_on:
      financial-web:
        condition: service_healthy
      financial-api:
        condition: service_healthy
      operational-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: textile-erp-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9190:9090"
    volumes:
      - ../financial/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - textile_erp_prometheus_data:/prometheus
    depends_on:
      financial-api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.3.1
    container_name: textile-erp-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - textile_erp_grafana_data:/var/lib/grafana
      - ../financial/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../financial/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  textile_erp_postgres_data:
  textile_erp_prometheus_data:
  textile_erp_grafana_data:
  textile_erp_portal_data:
