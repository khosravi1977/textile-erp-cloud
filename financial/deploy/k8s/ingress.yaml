apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: textile-erp
  namespace: textile-erp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: textile-erp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: textile-erp-api
                port:
                  name: http

