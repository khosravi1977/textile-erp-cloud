apiVersion: apps/v1
kind: Deployment
metadata:
  name: textile-erp-api
  namespace: textile-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: textile-erp-api
  template:
    metadata:
      labels:
        app: textile-erp-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: api
          image: textile-erp-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: textile-erp-config
            - secretRef:
                name: textile-erp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: textile-erp-api
  namespace: textile-erp
spec:
  selector:
    app: textile-erp-api
  ports:
    - name: http
      port: 8081
      targetPort: http

